# path ~/.config/GnuChanScreenShoot/GnuChanScreenShoot.conf
# WARNING: this is not a real Python script, diger Gnuchan programlarinin
# like config files, it is a CONFIG file. GnuChanScreenShoot reads this and
# decides its behavior.
#
# Where to save screenshots, in which format, with which hotkeys
# alacagini burada ayarlarsin. Degistirdigin degeri kaydet, bir sonraki
# calismada gecerli olur.
Version = "0.2.0"
SaveDir = "~/Pictures"
Format = "png"
Quality = 90
CaptureFocused = True
SettingsWindow = True
